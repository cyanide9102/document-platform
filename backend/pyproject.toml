[project]
name = "document-platform"
version = "0.1.0"
description = "Document Processing & Signing Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "temporalio>=1.32.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["document_platform"]
known-third-party = ["alembic"]
